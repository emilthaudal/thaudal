name: Build app

on:
  push:
    branches:
      - feature/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install, build, and test
        run: |
          bun install --frozen-lockfile
          bun run --if-present build
          bun run --if-present test
